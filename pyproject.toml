[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuroresearch-agent"
version = "1.0.0"
description = "AI-powered systematic review and meta-analysis agent built on Claude Agent SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "NeuroResearch Team" }
]
keywords = [
    "claude",
    "agent-sdk",
    "systematic-review",
    "meta-analysis",
    "neurosurgery",
    "medical-research"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "claude-agent-sdk>=1.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0.0",
    "jsonschema>=4.0.0",
    "pdfplumber>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
meta = "neuroresearch.cli.main:cli"

[project.urls]
Homepage = "https://github.com/neuroresearch/agent"
Documentation = "https://github.com/neuroresearch/agent#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/neuroresearch"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/.claude",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
